name: Brandbasecamp
slug: brandbasecamp
type: theme
version: 0.1.0
description: Super simple and customisable brand guidelines.
icon: rebel
author:
  name: MJD Studio
  email: hello@mjd.studio
homepage: https://github.com/mjd-studio/grav-theme-brandbasecamp
demo: http://demo.yoursite.com
keywords: grav, theme, etc
bugs: https://github.com/mjd-studio/grav-theme-brandbasecamp/issues
readme: https://github.com/mjd-studio/grav-theme-brandbasecamp/blob/develop/README.md
license: MIT

dependencies:
  - { name: grav, version: '>=1.6.0' }

form:
  validation: loose
  fields:
    dropdown.enabled:
        type: toggle
        label: Dropdown in Menu
        highlight: 1
        default: 1
        options:
          1: PLUGIN_ADMIN.ENABLED
          0: PLUGIN_ADMIN.DISABLED
        validate:
          type: bool
