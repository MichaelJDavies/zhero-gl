                      autofocus: true
                      codemirror:
                        mode: 'yaml'
                        indentUnit: 4
                        autofocus: true
                        indentWithTabs: false
                        lineNumbers: true
                        styleActiveLine: true
                        gutters: ['CodeMirror-lint-markers']
                        lint: true
                    header.media_order:
                      type: pagemedia
                      label: All page media


# ~~~~~~~~~~~~~~~~~~~~~~~~~~

#       Content blocks

# ~~~~~~~~~~~~~~~~~~~~~~~~~~

            header.blocks:
                type: blocks
                label: Page content
                style: vertical
                fields:




                  # Hero
                  # ~~~~~~~~~~~~~~~


                  .hero:
                    type: section
                    label: Hero
                    description: Full width page hero
                    fields:
                      .heading:
                        type: text
                        label: Heading
                      .content:
                        type: editorinline
                        label: Content


                  # Section heading
                  # ~~~~~~~~~~~~~~~


                  .page_group_intro:
                    type: section
                    label: Page group introduction
                    description: Add a title for a group of pages
                    fields:
                      .heading:
                        type: text
                        label: Heading
                      .content:
                        type: editorinline
                        label: Content

                      .page_link:
                        type: pages
                        size: medium
                        classes: fancy
                        label: Link to page
                        # start_route: '/'
                        show_all: true
                        show_modular: false
                        show_root: false
                        # help: PLUGIN_ADMIN.HOME_PAGE_HELP


                  # Standfirst
