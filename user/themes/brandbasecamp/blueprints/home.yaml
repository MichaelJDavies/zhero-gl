                  # Featured page card list
                  # ~~~~~~~~~~~~~~~~~~~~~~~

                  .featured_page_card_list:
                    type: section
                    label: Featured page card
                    description: 'Display the featured child page(s) of any given parent page'
                    fields:
                      .parent_page:
                        type: pages
                        size: large
                        classes: fancy
                        label: Parent page
                        # start_route: '/'
                        show_all: true
                        show_modular: false
                        show_root: false
                        help: 'Choose the parent page of the featured page(s) you want to show'
                      .limit:
                        type: number
                        # size: medium
                        classes: fancy
                        label: Limit to
                        # start_route: '/'
                        show_all: true
                        show_modular: false
                        show_root: false
                        help: 'If there are multiple featured pages, limit the number of them that are displayed'
                      
        options:
          type: tab
          title: PLUGIN_ADMIN.OPTIONS

          fields:

            publishing:
              type: section
              title: PLUGIN_ADMIN.PUBLISHING
              underline: true

              fields:
                header.published:
                  type: toggle
                  toggleable: true
                  label: PLUGIN_ADMIN.PUBLISHED
                  help: PLUGIN_ADMIN.PUBLISHED_HELP
                  highlight: 1
                  size: medium
                  options:
                    1: PLUGIN_ADMIN.YES
                    0: PLUGIN_ADMIN.NO
                  validate:
                    type: bool

                header.date:
                  type: datetime
                  label: PLUGIN_ADMIN.DATE
                  toggleable: true
                  help: PLUGIN_ADMIN.DATE_HELP

                header.publish_date:
                  type: datetime
                  label: PLUGIN_ADMIN.PUBLISHED_DATE
                  toggleable: true
                  help: PLUGIN_ADMIN.PUBLISHED_DATE_HELP

                header.unpublish_date:
                  type: datetime
                  label: PLUGIN_ADMIN.UNPUBLISHED_DATE
                  toggleable: true
                  help: PLUGIN_ADMIN.UNPUBLISHED_DATE_HELP

                header.metadata:
                  toggleable: true
                  type: array
                  label: PLUGIN_ADMIN.METADATA
                  help: PLUGIN_ADMIN.METADATA_HELP
                  placeholder_key: PLUGIN_ADMIN.METADATA_KEY
                  placeholder_value: PLUGIN_ADMIN.METADATA_VALUE

            # taxonomies:
