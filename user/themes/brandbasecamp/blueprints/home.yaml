                  # Call to action
                  # ~~~~~~~~~~~~~~
       

                  .call_to_action:
                    type: section
                    label: Call-to-action box
                    description: 'Add a call-to-action box with button'
                    fields:
                      .heading:
                        type: text
                        label: Heading
                      .content:
                        label: Content
                        type: editor
                      .button_text:
                        type: text
                        label: Button text
                      .button_type:
                        type: toggle
                        label: Filter our featured pages?
                        default: 2
                        options:
                            2: URL
                            1: Page
                            0: Download
                      .button_url:
                        type: text
                        label: Button URL
                      .button_link_internal:
                        type: pages
                        size: medium
                        classes: fancy
                        label: Parent page
                        # start_route: '/'
